<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car Lab</title>
<!-- A studio for the player cars (world/carModels.js): turntable views, the
     cabin from the driver's seat, day or night. Serve the project root and open
     /tools/car-lab.html?model=aurora&night=1  (drag to orbit, 1-4 picks a car,
     C sits in the cockpit, N toggles night). -->
<style>
  html,body{margin:0;height:100%;background:#0b0c0e;color:#cfd3d8;font:12px/1.4 system-ui,sans-serif;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;left:16px;top:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three/three.webgpu.js","three/webgpu":"../vendor/three/three.webgpu.js","three/tsl":"../vendor/three/three.tsl.js","three/addons/":"../vendor/three/addons/"}}</script>
</head>
<body>
<canvas id="c"></canvas><div id="hud"></div>
<script type="module">
import * as T from 'three';
import {pass} from 'three/tsl';
import {bloom} from 'three/addons/tsl/display/BloomNode.js';
import {makePlayerCar} from '../world/cars.js';
import {MODELS, preloadCars} from '../world/carModels.js';
await preloadCars();
import {CarFx} from '../world/carFx.js';

const q = new URLSearchParams(location.search);
const renderer = new T.WebGPURenderer({canvas: document.getElementById('c'), antialias: true});
await renderer.init();
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = T.AgXToneMapping; renderer.shadowMap.enabled = true;
const scene = new T.Scene(), camera = new T.PerspectiveCamera(32, innerWidth / innerHeight, .05, 200);

// Environment: an outdoor sky (default) or a dark studio with soft boxes (?studio=1).
const studio = q.get('studio') === '1';
const env = new T.Scene();
if (studio) {
  env.add(new T.Mesh(new T.BoxGeometry(60, 30, 60), new T.MeshBasicMaterial({color: '#0a0b0d', side: T.BackSide})));
  const panel = (w, h, x, y, z, rx, ry, c = 4) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({color: new T.Color(c, c, c * 1.02), side: T.DoubleSide})); m.position.set(x, y, z); m.rotation.set(rx, ry, 0); env.add(m); };
  panel(3, 18, 0, 12, 0, Math.PI / 2, 0, 5); panel(1.2, 18, -5, 11, 0, Math.PI / 2, 0, 3); panel(1.2, 18, 5, 11, 0, Math.PI / 2, 0, 3);
  panel(18, 3, 0, 3, -20, 0, 0, 1.2); panel(4, 6, 20, 4, 5, 0, -Math.PI / 2, 1.5); panel(4, 6, -20, 4, -5, 0, Math.PI / 2, 1.5);
} else {
  const sky = new T.MeshBasicNodeMaterial({side: T.BackSide});
  const {positionLocal: P, mix: mx, vec3: v3, smoothstep: ss, normalize} = await import('three/tsl');
  const d = normalize(P);
  sky.colorNode = mx(mx(v3(.03, .03, .032), v3(.16, .16, .16), ss(-.25, 0, d.y)), mx(v3(1.6, 1.5, 1.35), v3(.22, .32, .55), ss(0, .35, d.y)), ss(-.01, .01, d.y));
  env.add(new T.Mesh(new T.SphereGeometry(50, 32, 16), sky));
  const sun = new T.Mesh(new T.SphereGeometry(3, 16, 8), new T.MeshBasicMaterial({color: new T.Color(30, 28, 24)})); sun.position.set(25, 30, 15); env.add(sun);
}
const pmrem = new T.PMREMGenerator(renderer); scene.environment = pmrem.fromScene(env, 0, .1, 100).texture;
scene.background = new T.Color(studio ? '#0b0c0e' : '#1b1d21');
const floor = new T.Mesh(new T.CircleGeometry(30, 64), new T.MeshPhysicalMaterial({color: studio ? '#141619' : '#2a2c2f', roughness: .32, metalness: .1, clearcoat: .6, clearcoatRoughness: .2}));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const key = new T.DirectionalLight('#fff4e6', studio ? 2.2 : 3); key.position.set(5, 7, 3); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, {left: -5, right: 5, top: 5, bottom: -5}); key.shadow.bias = -.0003; key.shadow.normalBias = .02; scene.add(key);
const hemi = new T.HemisphereLight('#b8c4d0', '#202020', .5); scene.add(hemi);

const post = new T.RenderPipeline(renderer), sp = pass(scene, camera);
post.outputNode = sp.getTextureNode('output').add(bloom(sp, .35, .3, .85));

let current = null, fx = null, night = q.get('night') === '1', cockpit = q.get('cockpit') === '1';
const vehicleStub = {object: null, wheels: [], body: null};
function build(id) {
  if (current) { scene.remove(current.object); fx?.dispose?.(); }
  current = makePlayerCar({model: id});
  scene.add(current.object);
  fx = new CarFx({scene, vehicle: current});
  document.getElementById('hud').textContent = (MODELS.find(m => m.id === id)?.name || id) + (night ? ' · night' : '');
  window.lab.car = current; window.lab.fx = fx;
}
let yaw = +(q.get('yaw') ?? 35) * Math.PI / 180, pitch = +(q.get('pitch') ?? 12) * Math.PI / 180, dist = +(q.get('dist') ?? 8.5), target = new T.Vector3(0, .6, 0);
let steer = 0;
window.lab = {
  build, T, scene, camera,
  view(y, p, d, ty = .6, fov = 32, tz = 0, tx = 0) { yaw = y * Math.PI / 180; pitch = p * Math.PI / 180; dist = d; target.set(tx, ty, tz); camera.fov = fov; camera.updateProjectionMatrix(); cockpit = false; },
  signal(mode) { fx.setSignal(mode); },
  seat(on = true, lookYaw = 0, lookPitch = -8) { cockpit = on; this.lookYaw = lookYaw; this.lookPitch = lookPitch; },
  night(on) { night = on; },
  steer(v) { steer = v; },
  lookYaw: 0, lookPitch: -8,
};
build(q.get('model') || 'aurora');
addEventListener('keydown', e => {
  const i = '1234'.indexOf(e.key); if (i >= 0) build(MODELS[i].id);
  if (e.key === 'n') night = !night;
  if (e.key === 'c') cockpit = !cockpit;
});
let drag = null;
addEventListener('pointerdown', e => drag = [e.clientX, e.clientY]);
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (!drag) return; if (cockpit) { lab.lookYaw -= (e.clientX - drag[0]) * .2; lab.lookPitch -= (e.clientY - drag[1]) * .2; } else { yaw -= (e.clientX - drag[0]) * .006; pitch = Math.max(-.05, Math.min(1.5, pitch + (e.clientY - drag[1]) * .004)); } drag = [e.clientX, e.clientY]; });
addEventListener('wheel', e => dist = Math.max(3, Math.min(20, dist * (1 + e.deltaY * .001))));
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const fakeCar = {body: {linvel: () => ({x: 0, y: 0, z: 0}), angvel: () => ({x: 0, y: 0, z: 0})}, rearSlip: 0, frontSlip: 0, handbrake: 0, wheelState: () => ({contact: false})};
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const o = current.object;
  const dim = night ? .03 : 1;
  key.intensity = (studio ? 2.2 : 3) * dim; hemi.intensity = .5 * dim; scene.environmentIntensity = night ? .05 : 1;
  if (current.body) { current.body.head.emissiveIntensity = night ? 2.2 : .6; current.body.tail.emissiveIntensity = night ? .9 : .45; }
  fx.update(dt, {car: fakeCar, state: {}, day: night ? 0 : 1, night: night ? 1 : 0, cockpit, steer, hour: 10.14});
  if (current.body.grille) current.body.grille.emissiveIntensity = night ? .55 : 0;
  o.visible = true;
  if (cockpit && fx.eye) {
    const e = fx.eye; camera.fov = 70; camera.updateProjectionMatrix();
    camera.position.set(e[0], e[1], e[2]);
    const ly = lab.lookYaw * Math.PI / 180, lp = lab.lookPitch * Math.PI / 180;
    camera.lookAt(e[0] + Math.sin(ly) * Math.cos(lp) * 10, e[1] + Math.sin(lp) * 10, e[2] + Math.cos(ly) * Math.cos(lp) * 10);
  } else {
    camera.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
    camera.lookAt(target);
  }
  post.render();
  window.lab.frames = (window.lab.frames || 0) + 1;
});
</script>
</body>
</html>
